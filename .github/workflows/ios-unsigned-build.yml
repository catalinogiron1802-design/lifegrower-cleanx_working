name: Build unsigned iOS IPA

# Manual trigger only — go to the Actions tab on GitHub, pick this workflow,
# and click "Run workflow". Produces an unsigned .ipa (no Apple Developer
# Program account involved) meant to be re-signed on-device by
# SideStore/AltStore using your own free Apple ID.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Find workspace and scheme
        id: xc
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n1)
          echo "Workspace: $WORKSPACE"

          echo "All schemes reported by xcodebuild -list (for reference):"
          xcodebuild -list -workspace "$WORKSPACE" -json || true

          # The app's own scheme is named after its .xcodeproj (CocoaPods' own
          # project is always "Pods.xcodeproj", so excluding it isolates the
          # real app project). Picking schemes[0] from `-list` was unreliable —
          # it previously grabbed a Pods-related scheme, building only the
          # dependency libraries with no actual .app product.
          APP_PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" ! -name "Pods.xcodeproj" | head -n1)
          SCHEME=$(basename "$APP_PROJECT" .xcodeproj)

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"

      - name: Build (unsigned, device build)
        run: |
          set -euo pipefail
          xcodebuild clean build \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="-"

      - name: Package .ipa
        run: |
          set -euo pipefail
          echo "Listing build/DerivedData/Build/Products for debugging:"
          find build/DerivedData/Build/Products -maxdepth 2 2>/dev/null || echo "(Products dir not found)"

          APP_PATH=$(find build/DerivedData -type d -name "*.app" | grep -v "/Pods/" | head -n1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found anywhere under build/DerivedData. Full tree:"
            find build/DerivedData -maxdepth 5
            exit 1
          fi

          echo "Found app bundle: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r -y LifeGrower-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeGrower-unsigned-ipa
          path: build/LifeGrower-unsigned.ipa
          retention-days: 30
